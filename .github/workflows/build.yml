name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with .NET Framework csc
        shell: cmd
        env:
          CI: 'true'
        run: build.bat

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath QuickCopyPanel.zip

      - uses: actions/upload-artifact@v4
        with:
          name: QuickCopyPanel
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/QuickCopyPanel.exe
            QuickCopyPanel.zip
